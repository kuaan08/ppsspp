name: Build PPSSPP Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'CMakeLists.txt'
      - 'Core/**'
      - '.github/workflows/midnight-club3-android.yml'

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Accept Android SDK licenses and install build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"

      - name: Build release APK
        run: gradle --no-daemon :android:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-android-release
          path: android/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
